<!DOCTYPE html>
<html>
<head>
  <title>xtflix - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background: #1a1a2e;
      padding: 40px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .login-container h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #e94560;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #a0a0b0;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 16px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #e94560;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-btn:hover {
      background: #c73652;
    }
    .error-message {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h1>xtflix</h1>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  <button class="login-btn" id="login-btn">Login</button>
  <p class="error-message" id="error-message"></p>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
