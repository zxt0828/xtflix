<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xtflix - Movie Details</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .movie-header {
      margin-bottom: 32px;
    }

    .movie-title {
      font-size: 32px;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 6px;
    }

    .movie-meta {
      color: #7d8590;
      font-size: 15px;
    }

    .movie-meta span {
      margin-right: 16px;
    }

    .rating-badge {
      display: inline-block;
      background: #238636;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7d8590;
      margin-bottom: 8px;
    }

    .genre-tag {
      display: inline-block;
      background: #1c2333;
      color: #8b949e;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 13px;
      margin: 0 6px 6px 0;
    }

    .stars-list {
      list-style: none;
    }

    .stars-list li {
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
    }

    .stars-list li:last-child {
      border-bottom: none;
    }

    .star-link {
      color: #d2a8ff;
      text-decoration: none;
      font-size: 15px;
    }

    .star-link:hover {
      text-decoration: underline;
    }

    .loading {
      color: #484f58;
      font-style: italic;
      padding: 40px 0;
      text-align: center;
    }

    .movie-id {
      color: #484f58;
      font-size: 13px;
      font-family: monospace;
    }
  </style>
</head>
<body>
<div class="container">

  <div id="movie-detail">
    <p class="loading">Loading movie details...</p>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/single-movie.js"></script>
</body>
</html>
